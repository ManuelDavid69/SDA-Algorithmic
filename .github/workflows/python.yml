name: CI Python

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13" ]

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installation du projet et de ses dépendances de développement
        run: python -m pip install -e ".[dev]"

      - name: Analyse statique avec Ruff
        run: python -m ruff check .

      - name: Exécution de la suite de tests
        run: python -m pytest

      - name: Vérification de la compilation de chaque module
        run: python -m compileall -q src
